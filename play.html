<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Station // WHRHS CS Club</title>
    <link rel="stylesheet" href="styleFolder/style.css" />
    <link rel="stylesheet" href="styleFolder/index.css" />
    <link rel="stylesheet" href="styleFolder/projects.css"/>
    
    <script type="module" src="scriptFolder/header.js"></script>
    <script type="module" src="scriptFolder/footer.js"></script>
    <script type="module" src="scriptFolder/play.js"></script>
</head>
<body>
    <cs-header active-page="projects"></cs-header>

    <main class="projects-main" style="padding: 6rem 2rem 4rem; max-width: 1200px; margin: 0 auto; min-height: 80vh;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <a href="projects.html" class="btn-outline" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;">
                ← Return to Arcade
            </a>
            <span id="gameEngineTag" style="font-family: monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--primary); color: var(--primary); padding: 0.4rem 0.8rem; border-radius: var(--radius-sm);">
                LOADING ENGINE...
            </span>
        </div>

        <div style="margin-bottom: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
            <h1 id="gameTitle" style="font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 600; margin: 0; letter-spacing: -0.02em;">
                Loading Project Core...
            </h1>
            <p id="gameAuthor" style="color: var(--muted-fg); margin-top: 0.5rem; font-family: monospace; font-size: 0.9rem;">
                Deploying runtime binaries...
            </p>
        </div>

        <div style="background: #000; border: 1px solid var(--border); border-radius: var(--radius-sm); position: relative; width: 100%; aspect-ratio: 16 / 9; box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden;">
            <div id="engineStatusScreen" style="position: absolute; inset: 0; background: var(--background); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; font-family: monospace; color: var(--muted-fg); gap: 1rem;">
                <div style="width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                <p id="statusMessage">Booting system matrix...</p>
            </div>

            <iframe 
                id="arcadeViewport" 
                src="" 
                style="width: 100%; height: 100%; border: none; background: transparent;"
                allow="autoplay; fullscreen; keyboard; focus-without-user-activation"
                sandbox="allow-scripts allow-same-origin allow-pointer-lock"
            ></iframe>
        </div>
    </main>

    <cs-footer></cs-footer>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
