<!DOCTYPE html>
<html lang="en" data-theme="terminal">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Station // WHRHS CS Club</title>
    <link rel="stylesheet" href="styleFolder/style.css" />
    <link rel="stylesheet" href="styleFolder/index.css" />
    <link rel="stylesheet" href="styleFolder/projects.css"/>
    
    <script type="module" src="scriptFolder/header.js"></script>
    <script type="module" src="scriptFolder/footer.js"></script>
    <script type="module" src="scriptFolder/play.js"></script>
</head>
<body>
    <cs-header active-page="projects"></cs-header>

    <main class="play-main">
        <div class="play-header-bar">
            <a href="projects.html" class="btn-outline" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;">
                ← Return to Arcade
            </a>
            <span id="gameEngineTag" style="font-family: monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--primary); color: var(--primary); padding: 0.4rem 0.8rem; border-radius: var(--radius-sm); text-align: center;">
                LOADING ENGINE...
            </span>
        </div>

        <div style="margin-bottom: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
            <h1 id="gameTitle" style="font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 600; margin: 0; letter-spacing: -0.02em;">
                Loading Project Core...
            </h1>
            <p id="gameAuthor" style="color: var(--muted-fg); margin-top: 0.5rem; font-family: monospace; font-size: 0.9rem;">
                Deploying runtime binaries...
            </p>
            <button type="button" id="editDetailsBtn" class="btn-outline play-edit-open" hidden>Edit details</button>
        </div>

        <div id="gameDetails" class="play-details" hidden></div>
        <div class="play-viewport-container">
            <div id="engineStatusScreen" style="position: absolute; inset: 0; background: var(--background); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; font-family: monospace; color: var(--muted-fg); gap: 1rem;">
                <div class="play-status-spinner" style="width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                <p id="statusMessage" role="status" style="max-width: 36rem; padding: 0 1.5rem; text-align: center; line-height: 1.5;">Booting system matrix...</p>
            </div>

            <iframe 
                id="arcadeViewport" 
                src="" 
                style="width: 100%; height: 100%; border: none; background: transparent;"
                allow="autoplay; fullscreen;"
                sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals"
            ></iframe>
        </div>
    </main>

    <dialog id="editDetailsDialog" class="play-edit-dialog" aria-labelledby="editDetailsTitle">
        <form id="editDetailsForm" class="play-edit-form">
            <h2 id="editDetailsTitle" class="play-edit-title">Edit details</h2>
            <div class="play-edit-field">
                <label for="editDescription">About this game</label>
                <textarea id="editDescription" data-detail="description" rows="5" maxlength="1000" aria-describedby="editDescriptionCount"></textarea>
                <span id="editDescriptionCount" class="play-edit-count" aria-live="polite"></span>
            </div>
            <div class="play-edit-field">
                <label for="editCredits">Made with help from</label>
                <textarea id="editCredits" data-detail="credits" rows="2" maxlength="300" aria-describedby="editCreditsCount"></textarea>
                <span id="editCreditsCount" class="play-edit-count" aria-live="polite"></span>
            </div>
            <div class="play-edit-field">
                <label for="editKnownBugs">Known bugs</label>
                <textarea id="editKnownBugs" data-detail="knownBugs" rows="4" maxlength="1000" aria-describedby="editKnownBugsCount"></textarea>
                <span id="editKnownBugsCount" class="play-edit-count" aria-live="polite"></span>
            </div>
            <div class="play-edit-field" id="editCoverGroup" hidden>
                <label for="editCover">Cover image (PNG, JPEG or WebP)</label>
                <input type="file" id="editCover" accept="image/png,image/jpeg,image/webp" />
                <img id="editCoverPreview" class="play-edit-cover" alt="Cover preview" width="1200" height="750" hidden />
                <label class="play-edit-check" id="editRemoveCoverLabel" hidden><input type="checkbox" id="editRemoveCover" /> Remove the current cover</label>
                <p id="editCoverError" class="play-edit-error" role="alert"></p>
            </div>
            <p id="editStatus" class="play-edit-status" role="status"></p>
            <div class="play-edit-actions">
                <button type="button" id="editCancel" class="btn-outline">Cancel</button>
                <button type="submit" id="editSave" class="btn-primary">Save</button>
            </div>
        </form>
    </dialog>
    <cs-footer></cs-footer>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
