<!DOCTYPE html>
<html lang="en" data-theme="terminal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — WHRHS CS Club</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styleFolder/style.css">
    <link rel="stylesheet" href="styleFolder/auth.css">
    <link rel="stylesheet" href="styleFolder/themes.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div id="resetView" class="auth-card">

        <a href="login.html">← Back to sign in</a>

        <h2>Choose a new password</h2>
        <p class="auth-subtitle" id="resetSubtitle">Checking your reset link...</p>

        <form id="resetPasswordForm" hidden>
            <div id="resetFeedback" class="auth-feedback" hidden></div>

            <div class="input-group">
                <label>New password</label>
                <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
            </div>

            <div class="input-group">
                <label>Confirm new password</label>
                <input type="password" id="confirmNewPassword" required minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="auth-submit-btn" id="resetSubmitBtn">
                Update password <span class="arrow">→</span>
            </button>
        </form>
    </div>

</div>

<script type="module" src="scriptFolder/reset-password.js"></script>

</body>
</html>
